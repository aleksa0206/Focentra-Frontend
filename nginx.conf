server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:4000/;
    proxy_set_header Host $host;
    # The backend scopes the refresh cookie to /auth; from the browser's side that is /api/auth.
    proxy_cookie_path /auth /api/auth;
  }

  # nginx's mime.types has no entry for .webmanifest.
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  location / {
    # index.html and ngsw.json must never be served stale; hashed bundles revalidate cheaply.
    add_header Cache-Control "no-cache";
    # Here and not on the server block: nginx drops inherited add_header lines in any location
    # that sets its own. The app needs only its own origin, Google Fonts and data: images (the 2FA
    # QR code). The service worker fetches the fonts itself, so their origins are in connect-src
    # too. Angular escapes template output; this is the second line against XSS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Anything that is not a real file is an app route.
    try_files $uri /index.html;
  }
}
